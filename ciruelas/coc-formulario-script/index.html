function subirArchivo(fl){
  return new Promise(function(res, rej){
    if (!uid) return rej(new Error('sinid'));
    if (fl.size > 10 * 1024 * 1024) return rej(new Error('grande'));
    var rd = new FileReader();
    rd.onerror = function(){ rej(new Error('lectura')); };
    rd.onload = function(){
      fetch(EXEC, { method:'POST', headers:{ 'Content-Type':'text/plain' }, body:JSON.stringify({ tipo:'subir', id:uid, nombre:fl.name, mime:fl.type, b64:String(rd.result).split(',')[1] }) })
        .then(function(r){ return r.json(); })
        .then(function(j){ if (j && j.ok) res(j); else rej(new Error((j && j.error) || 'fallo')); })
        .catch(rej);
    };
    rd.readAsDataURL(fl);
  });
}

function merge(base, src){
  Object.keys(src || {}).forEach(function(k){
    if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) merge(base[k], src[k]);
    else base[k] = src[k];
  });
  return base;
}
