  :root{

         stroke-linejoin:round;}.fig .bhead .bsub{fill:var(--muted); font-weight:500;}.fig .bhpp .bnum,.fig .bhpp .btit{fill:var(--c-pp);}.fig .bhtr .bnum,.fig .bhtr .btit{fill:var(--c-tr);}.fig .bhrsc .bnum,.fig .bhrsc .btit{fill:var(--c-rsc);}.fig .bhtsc .bnum,.fig .bhtsc .btit{fill:var(--c-tsc);}.fig .bhfra .bnum,.fig .bhfra .btit{fill:var(--c-fra);}.fig .bhfin .bnum,.fig .bhfin .btit{fill:var(--c-fin);}
  
.fig .cocpt circle{fill:var(--accent); stroke:var(--panel); stroke-width:2;} .fig .cocnum{fill:var(--panel);}

  .layout{grid-template-columns:minmax(0,1fr) !important;}

  table.obsT td{padding:5px 8px; border-bottom:1px solid var(--hair); vertical-align:top;} table.obsT td:first-child{width:42%;} table.obsT tr.g td{background:var(--accent-soft); font-weight:700; color:var(--accent); font-size:12.5px;}
  table.obsT textarea{min-height:36px; padding:6px 8px; font-size:13px;} .badge{display:inline-block; font-size:10.5px; font-weight:700; border-radius:99px; padding:0 7px; margin-right:6px;} .badge.p{background:var(--accent); color:var(--on-accent);} .badge.m{background:var(--wa-bg); border:1px solid var(--wa-br);}

  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--fg); font-family:var(--ui); font-size:15px; line-height:1.55;}
  button,input,select,textarea{font:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .wrap{max-width:1180px; margin:0 auto;
        padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
        padding-block:22px 64px;}
  header.top{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:flex-end; justify-content:space-between;
             padding-bottom:18px; border-bottom:2px solid var(--accent);}
  .eyebrow{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); font-weight:600;}
  h1{font-family:var(--display); font-size:clamp(24px,3.6vw,34px); line-height:1.13; margin:4px 0 0; letter-spacing:-.01em; text-wrap:balance;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .chip{font-size:12.5px; padding:4px 11px; border-radius:99px; border:1px solid var(--hair); background:var(--panel); color:var(--muted); white-space:nowrap;}
  .chip.dl{border-color:var(--warn); color:var(--warn); background:var(--warn-bg);}
  .chip.sv{color:var(--ok); border-color:var(--ok);} .chip.sv.busy{color:var(--muted); border-color:var(--hair);}
  .layout{display:grid; grid-template-columns:260px minmax(0,1fr); gap:28px; margin-top:22px; align-items:start;}
  nav#nav{position:sticky; top:12px; display:flex; flex-direction:column; gap:3px;}
  nav#nav button{appearance:none; text-align:left; background:none; border:1px solid transparent; border-radius:10px; padding:9px 11px; cursor:pointer;
                 display:grid; grid-template-columns:22px minmax(0,1fr); gap:2px 10px; align-items:center; font-size:13.5px;}
  nav#nav button:hover{background:var(--accent-soft);}

  nav#nav .dot.ok{border-color:var(--ok); background:var(--ok);} nav#nav .dot.part{border-color:var(--warn); background:linear-gradient(90deg,var(--warn) 50%,transparent 50%);}
  nav#nav b{font-weight:600; display:block; line-height:1.25;}
  nav#nav small{grid-column:2; color:var(--muted); font-size:11.5px; line-height:1.3;}
  nav#nav hr{border:0; border-top:1px solid var(--hair); margin:6px 8px;}
  main#main{min-width:0; background:var(--panel); border:1px solid var(--hair); border-radius:16px; padding:26px 28px 30px;}
  main h2{font-family:var(--display); font-size:24px; margin:0 0 6px; line-height:1.2;}

var EXEC = 'https://script.google.com/macros/s/AKfycbyseELnaEB9lqHMv0OxF-eXU7wOTzmwN2aReJidhjlUWZ80KwMAJpfCTXOjq26_1k-JRw/exec';
var ID_OK = /^[a-f0-9]{16,64}$/;
var D = blank(), view = 'inicio', uid = null, assets = null;
function nuevoId(){ var a = new Uint8Array(16); crypto.getRandomValues(a); return Array.prototype.map.call(a, function(b){ return ('0' + b.toString(16)).slice(-2); }).join(''); }
/* Código propio de cada respuesta: viaja en la dirección (?c=…) y se guarda en este navegador. */
function obtenerUid(){
  var id = null;
  try { var q = new URLSearchParams(location.search).get('c'); if (q && ID_OK.test(q)) id = q; } catch (_) {}
  try { if (!id){ var s = localStorage.getItem('valflujo-uid2'); if (s && ID_OK.test(s)) id = s; } } catch (_) {}
  if (!id) id = nuevoId();
  try { localStorage.setItem('valflujo-uid2', id); } catch (_) {}
  try { history.replaceState(null, '', '?c=' + id); } catch (_) {}
  return id;
}
function cargarRemoto(id){
  return new Promise(function(res){
    var cb = 'cb' + Date.now(), s = document.createElement('script'), t;
    function fin(v){ clearTimeout(t); delete window[cb]; s.remove(); res(v); }
    window[cb] = function(r){ fin(r && r.ok ? r.datos : null); };
    s.onerror = function(){ fin(null); };
    t = setTimeout(function(){ fin(null); }, 10000);
    s.src = EXEC + '?q=cargar&id=' + id + '&callback=' + cb + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}
function blank(){ return { meta:{}, val:{ rows:{}, puntos:{}, falta:'' }, m1:{ rows:[{}], adj:[], pm:{}, post:{} }, pc:{ post:{} }, neb:{ orig:[], adj:[] }, cert:{ adj:[] }, m2:{ docs:[], sis:[], post:{} }, m3:{ sup:{ propio:{}, contratado:{}, spot:{}, acopiador:{} }, post:{} }, m4:{ rows:[{}], post:{} }, m5:{ terceros:[], post:{} }, estado:'borrador' }; }
function get(path){ return path.split('.').reduce(function(o, k){ return o == null ? undefined : o[k]; }, D); }
function set(path, val){
  var ks = path.split('.'), o = D;
  for (var i = 0; i < ks.length - 1; i++){ if (o[ks[i]] == null) o[ks[i]] = /^\d+$/.test(ks[i + 1]) ? [] : {}; o = o[ks[i]]; }
  o[ks[ks.length - 1]] = val;
}
var saveTimer = null;
function changed(){
  D.actualizado = Date.now();

async function save(){
  var chip = $('#saveChip');
  if (!uid){ chip.textContent = 'Guardado solo en este navegador'; chip.classList.add('busy'); return; }
  try {
    await fetch(EXEC, { method:'POST', mode:'no-cors', headers:{ 'Content-Type':'text/plain' }, body:JSON.stringify({ tipo:'guardar', id:uid, datos:D }) });
    chip.textContent = 'Guardado ' + new Date().toLocaleTimeString('es-CL', { hour:'2-digit', minute:'2-digit' }); chip.classList.remove('busy');
  } catch (e) { chip.textContent = 'No se pudo guardar; reintentando'; chip.classList.add('busy'); clearTimeout(saveTimer); saveTimer = setTimeout(save, 4000); }
}

/* ------------------------------------------------------------------ avance */
function st(id){
  var n = function(x){ return x != null && String(x).trim() !== ''; };
  if (id === 'meta'){ var m = D.meta; return n(m.empresa) && n(m.persona) && n(m.cargo) && n(m.correo) ? 'ok' : (n(m.empresa) || n(m.persona) ? 'part' : 'none'); }
  if (id === 'pc'){ return obsCount() ? 'ok' : 'none'; }
  if (id === 'esp'){ var b = D.neb; return n(b.desc) && b.orig.length ? 'ok' : (n(b.desc) || b.orig.length || b.adj.length || n(D.cert.tiene) || n(D.pc.post.m) ? 'part' : 'none'); }
  return 'none';
}
function obsCount(){
  var c = 0, f = function(o){ if (o && String(o.o || '').trim()) c++; };
  Object.keys(D.val.rows).forEach(function(k){ f(D.val.rows[k]); }); Object.keys(D.val.puntos).forEach(function(k){ f(D.val.puntos[k]); });
  Object.keys(D.m1.pm || {}).forEach(function(k){ if (String(D.m1.pm[k].obs || '').trim()) c++; });
  (D.m1.rows || []).forEach(function(r){ if (String(r.desc || '').trim()) c++; });
  return c;
}
function updateNav(){
  $('#nav').innerHTML = SECCIONES.map(function(s){

  }).join('');
}

    }

function merge(base, src){
  Object.keys(src || {}).forEach(function(k){
    if (src[k] && typeof src[k] === 'object' && !Array.isArray(src[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) merge(base[k], src[k]);
    else base[k] = src[k];
  });
  return base;
}

  render();
}
