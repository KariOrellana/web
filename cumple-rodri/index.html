<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fotos y videos, cumple de Rodri</title>
<meta name="description" content="Sube tus fotos y videos del cumpleaños de Rodrigo.">
<meta property="og:type" content="website">
<meta property="og:title" content="Fotos y videos del cumple de Rodri">
<meta property="og:description" content="Escanea el código o toca el botón para subir tus fotos y videos.">
<meta property="og:url" content="https://extensiondigital.cl/cumple-rodri/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--noche:#0a1030;--amarillo:#ffd23f;--brasa:#ff7a1a;--hueso:#f3e9d2;--tinta:#1a0a05}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(ellipse at 50% 30%,#141c4c,var(--noche) 70%);color:var(--hueso);font-family:"Barlow",Arial,sans-serif;text-align:center}
main{width:min(460px,100%)}
h1{font-family:"Bangers",Impact,sans-serif;font-weight:400;letter-spacing:.03em;font-size:clamp(2.6rem,12vw,4rem);line-height:1;color:var(--amarillo);text-shadow:0 0 18px #ff7a1a99,0 4px 0 var(--tinta)}
p{font-size:1.15rem;margin:12px 0 22px}
.qr{background:#fff;padding:16px;border:6px solid var(--amarillo);box-shadow:0 0 30px #ffd23f55;display:inline-block}
.qr img{display:block;width:min(300px,70vw);height:auto}
.btn{display:inline-block;margin-top:24px;background:var(--brasa);color:var(--tinta);font-weight:700;font-size:1.25rem;padding:15px 26px;text-decoration:none;border:3px solid var(--tinta);box-shadow:0 5px 0 var(--tinta)}
.btn:focus-visible{outline:3px solid var(--amarillo);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>Fotos y videos del cumple de Rodri</h1>
  <p>Escanea el código o toca el botón para subir tus fotos y videos, y ver los de todos.</p>
  <div class="qr"><img src="qr-fotos.png" alt="Código QR para subir fotos y videos"></div><br>
  <a class="btn" href="https://extensiondigital.cl/cumple-rodri/fotos/">Subir fotos y videos</a>
</main>
</body>
</html>
